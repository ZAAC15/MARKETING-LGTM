[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-lgtm-api"
version = "0.1.0"
description = "API privada de inteligencia comercial y marketing para LGTM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
